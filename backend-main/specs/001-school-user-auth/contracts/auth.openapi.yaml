openapi: 3.1.0
info:
  title: School Inventory Authentication API
  version: 1.0.0
  description: Contract for registration, login, logout, and current-user profile.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register a school staff account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; email confirmation is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/DependencyError'
  /auth/login:
    post:
      summary: Log in an active and verified school staff account
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/DependencyError'
  /auth/logout:
    post:
      summary: Log out the current session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session is no longer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/DependencyError'
  /auth/profile:
    get:
      summary: Get the current school staff profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ProfileNotFoundError'
        '503':
          $ref: '#/components/responses/DependencyError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password, staff_id, school_unit]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        staff_id:
          type: string
          minLength: 3
          maxLength: 50
        school_unit:
          type: string
          minLength: 2
          maxLength: 100
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    PublicAccount:
      type: object
      additionalProperties: false
      required: [user_id, email, email_verification_required]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verification_required:
          type: boolean
          description: True only when Supabase requires email confirmation.
        session:
          $ref: '#/components/schemas/Session'
    Session:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_at]
      properties:
        access_token:
          type: string
          writeOnly: true
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          type: string
          const: bearer
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp in seconds
    UserProfile:
      type: object
      additionalProperties: false
      required: [user_id, full_name, email, staff_id, school_unit, role, account_status]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        staff_id:
          type: string
        school_unit:
          type: string
        role:
          type: string
          enum: [staff, inventory_officer, admin]
        account_status:
          type: string
          enum: [active, inactive]
    ApiError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
        details:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: 'null'
    RegisterSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data, message]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/PublicAccount'
        message:
          type: string
    LoginSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data, message]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required: [session, user]
          properties:
            session:
              $ref: '#/components/schemas/Session'
            user:
              $ref: '#/components/schemas/UserProfile'
        message:
          type: string
    ProfileSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserProfile'
    MessageSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, message, error]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        error:
          $ref: '#/components/schemas/ApiError'
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Email or staff ID conflicts with an existing account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationError:
      description: Authentication failed or session is not accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProfileNotFoundError:
      description: Authenticated identity has no staff profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyError:
      description: Authentication dependency is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
